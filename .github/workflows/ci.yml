name: CI / CD - Verificación y Publicación OTA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # 1. Pipeline de calidad: se ejecuta en cada push y cada pull request
  verify:
    name: 1. Calidad, Pruebas y Build (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias limpias (npm ci)
        run: npm ci

      - name: Validar estilo y sintaxis (npm run lint)
        run: npm run lint

      - name: Ejecutar pruebas unitarias e integración (npm test)
        run: npm test

      - name: Compilar aplicación web para producción (npm run build)
        env:
          GITHUB_SHA: ${{ github.sha }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Guardar artefacto de build compilado
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 1

  # 2. Publicación OTA: se ejecuta solo en la rama principal y solo si el job de verify pasó en verde
  deploy-ota:
    name: 2. Generar Paquete OTA Firmado y Publicar
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Descargar artefacto de build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Configurar Java 17 para Android
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias para Capacitor
        run: npm ci

      - name: Sincronizar Capacitor y compilar APK de Android
        run: |
          npx cap sync android
          chmod +x android/gradlew
          (cd android && ./gradlew assembleDebug --no-daemon)
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Finanzas.apk

      - name: Subir APK como artefacto de GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Finanzas-APK
          path: dist/Finanzas.apk
          retention-days: 30

      - name: Generar bundle OTA firmado y calcular checksum
        id: bundle_step
        env:
          GITHUB_SHA: ${{ github.sha }}
          CAPGO_PRIVATE_KEY: ${{ secrets.CAPGO_PRIVATE_KEY }}
        run: |
          set -e
          
          # 1. Empaquetar el bundle web en dist.zip (excluyendo el archivo .apk)
          echo "Empaquetando contenido de dist en dist.zip..."
          (cd dist && zip -r ../dist.zip . -x "Finanzas.apk")
          
          SESSION_KEY=""
          
          # 2. Firmar/Cifrar el bundle si la llave privada está configurada en Secrets
          if [ -n "$CAPGO_PRIVATE_KEY" ]; then
            echo "Firmando bundle OTA con llave privada..."
            echo "$CAPGO_PRIVATE_KEY" > capgo_private.key
            chmod 600 capgo_private.key
            
            PLAIN_CHECKSUM=$(node -e 'console.log(require("crypto").createHash("sha256").update(require("fs").readFileSync("dist.zip")).digest("hex"))')
            ENCRYPT_OUT=$(npx -y @capgo/cli bundle encrypt dist.zip "$PLAIN_CHECKSUM" --key capgo_private.key --json 2>/dev/null || echo "{}")
            
            SESSION_KEY=$(node -e 'try { const o = JSON.parse(process.argv[1]); console.log(o.ivSessionKey || ""); } catch { console.log(""); }' "$ENCRYPT_OUT")
            ENCRYPTED_FILE=$(node -e 'try { const o = JSON.parse(process.argv[1]); console.log(o.filename || ""); } catch { console.log(""); }' "$ENCRYPT_OUT")
            
            if [ -n "$ENCRYPTED_FILE" ] && [ -f "$ENCRYPTED_FILE" ]; then
              mv "$ENCRYPTED_FILE" dist.zip
            fi
            
            rm -f capgo_private.key
          else
            echo "Aviso: CAPGO_PRIVATE_KEY no está configurada. Continuando con bundle estándar..."
          fi
          
          # 3. Generar version.json y colocar dist.zip dentro de dist con Node.js
          export SESSION_KEY
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            
            const zipBuffer = fs.readFileSync("dist.zip");
            const finalChecksum = crypto.createHash("sha256").update(zipBuffer).digest("hex");
            const sha = process.env.GITHUB_SHA || "unknown";
            const shortSha = sha.slice(0, 7);
            const sessionKey = process.env.SESSION_KEY || "";
            
            const manifest = {
              version: sha,
              shortVersion: `v-${shortSha}`,
              updatedAt: new Date().toISOString(),
              bundleUrl: "https://pintobg.github.io/App-personal/dist.zip",
              checksum: finalChecksum
            };
            
            if (sessionKey) {
              manifest.sessionKey = sessionKey;
            }
            
            fs.writeFileSync("dist/version.json", JSON.stringify(manifest, null, 2));
            fs.copyFileSync("dist.zip", "dist/dist.zip");
            console.log("Manifiesto version.json generado con checksum SHA256:", finalChecksum);
          '

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Publicar versión en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
